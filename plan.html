---
layout: none
permalink: /plan/
sitemap: false
---
<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F4F6F9; --surface:#FFFFFF; --sunk:#EDF1F6;
  --ink:#0C1826; --ink-2:#3D4F66; --muted:#69798F;
  --line:#D9E1EB; --line-2:#E7EDF4;
  --committed:#3D4F66; --committed-bg:#EAEEF4;
  --run:#0F7A52;       --run-bg:#E3F2EB;
  --intervals:#AD2E76; --intervals-bg:#FAE6F0;
  --long:#0B5CAB;      --long-bg:#E6F0FA;
  --strength:#6B3FA0;  --strength-bg:#F0EAF9;
  --station:#A8761A;   --station-bg:#FAF1DE;
  --deadline:#A82018;  --deadline-bg:#FBEAE8;
  --reminder:#0E6E7A;  --reminder-bg:#E2F1F3;
  --shadow:0 1px 2px rgba(12,24,38,.06),0 6px 20px -12px rgba(12,24,38,.16);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0B1220; --surface:#131C2B; --sunk:#0E1725;
  --ink:#E9EFF7; --ink-2:#B6C4D6; --muted:#8296AE;
  --line:#26344A; --line-2:#1D2A3D;
  --committed:#9DB0C8; --committed-bg:#1B2536;
  --run:#5FC295;       --run-bg:#11291F;
  --intervals:#E88BBE; --intervals-bg:#2E1322;
  --long:#7FB2EE;      --long-bg:#152539;
  --strength:#B79BE0;  --strength-bg:#221A33;
  --station:#DFA660;   --station-bg:#2B2113;
  --deadline:#F0938A;  --deadline-bg:#331917;
  --reminder:#63BFCB;  --reminder-bg:#0F2A2E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -14px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --ground:#0B1220; --surface:#131C2B; --sunk:#0E1725;
  --ink:#E9EFF7; --ink-2:#B6C4D6; --muted:#8296AE;
  --line:#26344A; --line-2:#1D2A3D;
  --committed:#9DB0C8; --committed-bg:#1B2536;
  --run:#5FC295;       --run-bg:#11291F;
  --intervals:#E88BBE; --intervals-bg:#2E1322;
  --long:#7FB2EE;      --long-bg:#152539;
  --strength:#B79BE0;  --strength-bg:#221A33;
  --station:#DFA660;   --station-bg:#2B2113;
  --deadline:#F0938A;  --deadline-bg:#331917;
  --reminder:#63BFCB;  --reminder-bg:#0F2A2E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-block:26px 70px;padding-left:18px;padding-right:18px}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0 0 3px}
.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.legend{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:22px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
  padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.lg i{width:9px;height:9px;border-radius:2.5px;flex:none}

.alert{background:var(--deadline-bg);border:1px solid var(--deadline);border-left-width:3px;
  border-radius:8px;padding:11px 14px;margin-bottom:20px;font-size:13.5px}
.alert b{font-weight:600}

.wk{margin-bottom:26px}
.wk-h{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
.wk-h h2{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;
  color:var(--muted);margin:0}
.wk-h .rng{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.grid{grid-template-columns:1fr}}

.day{background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:9px 9px 8px;min-height:104px;display:flex;flex-direction:column;gap:5px;
  box-shadow:var(--shadow)}
.day.is-today{border-color:var(--long);box-shadow:0 0 0 2px var(--long-bg),var(--shadow)}
.day.is-past{opacity:.5}
.dh{display:flex;align-items:baseline;gap:5px;margin-bottom:1px}
.dh .dow{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.dh .num{font-weight:700;font-size:15px;line-height:1}
.dh .mo{font-family:var(--mono);font-size:10px;color:var(--muted)}
.dh .tag{margin-left:auto;font-family:var(--mono);font-size:9px;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;color:var(--long)}

.ev{border-left:3px solid var(--committed);background:var(--committed-bg);
  border-radius:0 5px 5px 0;padding:4px 6px 4px 7px;font-size:12px;line-height:1.35}
.ev .t{font-family:var(--mono);font-size:9.5px;color:var(--muted);display:block}
.ev .n{font-weight:500;overflow-wrap:anywhere}
.ev .w{display:block;font-size:10.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.ev.run{border-color:var(--run);background:var(--run-bg)}
.ev.run .n{color:var(--run)}
.ev.intervals{border-color:var(--intervals);background:var(--intervals-bg)}
.ev.intervals .n{color:var(--intervals)}
.ev.long{border-color:var(--long);background:var(--long-bg)}
.ev.long .n{color:var(--long)}
.ev.strength{border-color:var(--strength);background:var(--strength-bg)}
.ev.strength .n{color:var(--strength)}
.ev.station{border-color:var(--station);background:var(--station-bg)}
.ev.station .n{color:var(--station)}
.ev.deadline{border-color:var(--deadline);background:var(--deadline-bg)}
.ev.deadline .n{color:var(--deadline)}
.ev.reminder{border-color:var(--reminder);background:var(--reminder-bg)}
.ev.reminder .n{color:var(--reminder)}
.ev.conflict{outline:2px solid var(--deadline);outline-offset:1px}

.free{margin-top:auto;padding-top:5px;border-top:1px dashed var(--line-2);
  font-family:var(--mono);font-size:9.5px;color:var(--muted);line-height:1.5}
.free b{color:var(--ink-2);font-weight:500}

.gate{max-width:380px;margin:14vh auto;padding:26px 26px 22px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.gate h1{font-size:19px;margin:0 0 6px}
.gate p{color:var(--muted);font-size:13px;margin:0 0 18px;line-height:1.55}
.gate input{width:100%;padding:10px 12px;font-family:var(--mono);font-size:14px;
  border:1px solid var(--line);border-radius:7px;background:var(--ground);color:var(--ink)}
.gate button{margin-top:11px;width:100%;padding:10px;border:0;border-radius:7px;
  background:var(--long);color:#fff;font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer}
.gate button[disabled]{opacity:.55;cursor:default}
.gate .msg{margin:12px 0 0;font-size:12.5px;min-height:1.2em;color:var(--muted)}
.gate .msg.err{color:var(--deadline)}
footer{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.8}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="gate" id="gate" hidden>
  <h1>Plan</h1>
  <p>This page is encrypted. The passphrase is checked in your browser and never
     sent anywhere.</p>
  <form id="gate-form">
    <input type="password" id="gate-pass" aria-label="Passphrase" autocomplete="current-password">
    <button type="submit" id="gate-btn">Unlock</button>
  </form>
  <p class="msg" id="gate-msg" role="status"></p>
</div>

<div class="wrap" id="wrap">
  <h1>Plan</h1>
  <p class="sub" id="sub"></p>
  <div id="alerts"></div>
  <div class="legend" id="legend"></div>
  <div id="weeks"></div>
  <footer id="foot"></footer>
</div>

<script id="payload" type="application/json"></script>
<script>
const KINDS = [
  ["committed","Scheduled"],["long","Long run"],["intervals","Intervals"],
  ["run","Easy run"],["strength","Strength"],["station","Station / Hyrox"],
  ["deadline","Due"],["reminder","Reminder"],
];
const esc = s => (s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(d){
  document.getElementById("sub").textContent =
    `${d.weeks.length} weeks from ${d.weeks[0].start} · built ${d.generated}`;

  document.getElementById("legend").innerHTML = KINDS.map(([k,label])=>{
    const n = d.counts[k]||0;
    return `<span class="lg"><i style="background:var(--${k})"></i>${label}${n?` <span class="mono" style="color:var(--muted)">${n}</span>`:""}</span>`;
  }).join("");

  document.getElementById("alerts").innerHTML = (d.all_conflicts||[]).length
    ? `<div class="alert"><b>${d.all_conflicts.length} recommendation${d.all_conflicts.length>1?"s":""} collide with something already scheduled:</b><br>${d.all_conflicts.map(esc).join("<br>")}</div>`
    : "";

  document.getElementById("weeks").innerHTML = d.weeks.map(w=>{
    const last = w.days[6];
    return `<section class="wk">
      <div class="wk-h"><h2>${esc(w.iso)}</h2>
        <span class="rng">${esc(w.days[0].month)} ${esc(w.days[0].day)} – ${esc(last.month)} ${esc(last.day)}</span></div>
      <div class="grid">${w.days.map(dayHTML).join("")}</div>
    </section>`;
  }).join("");

  document.getElementById("foot").innerHTML =
    `Scheduled items come from the Google Calendar ICS feed. Recommendations are ` +
    `suggestions placed in free windows, not bookings — nothing here writes back ` +
    `to your calendar.<br>Free windows assume a 06:00–22:00 day and ignore gaps ` +
    `under 75 minutes.`;
}

function dayHTML(day){
  const cls = ["day", day.today?"is-today":"", day.past?"is-past":""].filter(Boolean).join(" ");
  const items = day.items.map(it=>{
    const when = it.all_day ? (it.note && /^\d\d:\d\d$/.test(it.note) ? it.note : "all day")
                            : `${it.start}${it.end?"–"+it.end:""}`;
    const note = (!it.all_day || !/^\d\d:\d\d$/.test(it.note||"")) && it.note
                 ? `<span class="w">${esc(it.note)}</span>` : "";
    const bad = (day.conflicts||[]).some(c=>c.startsWith(it.title)) ? " conflict" : "";
    return `<div class="ev ${esc(it.kind)}${bad}"><span class="t">${esc(when)}</span>
      <span class="n">${esc(it.title)}</span>${note}</div>`;
  }).join("");
  const free = (day.free||[]).length
    ? `<div class="free"><b>free</b> ${day.free.map(f=>`${f.from}–${f.to}`).join("  ")}</div>` : "";
  return `<div class="${cls}">
    <div class="dh"><span class="dow">${esc(day.label)}</span>
      <span class="num">${esc(day.day)}</span><span class="mo">${esc(day.month)}</span>
      ${day.today?'<span class="tag">today</span>':""}</div>
    ${items}${free}</div>`;
}

(function(){
  const ENC_URL = "https://raw.githubusercontent.com/GeoffreyBian/geoffreybian.github.io/plan-data/plan.enc.json";
  const holder = document.getElementById("payload");
  const inline = holder ? holder.textContent.trim() : "";
  if (inline.charAt(0) === "{") { render(JSON.parse(inline)); return; }

  const wrap=document.getElementById("wrap"), gate=document.getElementById("gate"),
        msg=document.getElementById("gate-msg"), btn=document.getElementById("gate-btn"),
        input=document.getElementById("gate-pass");
  wrap.hidden = true; gate.hidden = false;
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  let blob = null;

  async function load(){
    if(!blob){
      const res = await fetch(ENC_URL,{cache:"no-cache"});
      if(!res.ok) throw new Error("Could not load the data file ("+res.status+").");
      blob = await res.json();
    }
    return blob;
  }
  async function decrypt(pass,b){
    const base = await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      {name:"PBKDF2",salt:b64(b.salt),iterations:b.iterations,hash:"SHA-256"},
      base,{name:"AES-GCM",length:256},false,["decrypt"]);
    const plain = await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(b.iv)},key,b64(b.ciphertext));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  document.getElementById("gate-form").addEventListener("submit", async e=>{
    e.preventDefault();
    if(!input.value) return;
    btn.disabled=true; msg.className="msg"; msg.textContent="Decrypting\u2026";
    try{
      const data = await decrypt(input.value, await load());
      input.value=""; gate.hidden=true; wrap.hidden=false; render(data);
    }catch(err){
      msg.className="msg err";
      msg.textContent = /Could not load/.test(err.message) ? err.message : "Wrong passphrase.";
      btn.disabled=false; input.select();
    }
  });
})();
</script>
</body>
</html>

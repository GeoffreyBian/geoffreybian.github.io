const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open(pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(BLOB.salt), iterations: BLOB.iterations, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(BLOB.iv) }, key, bytes(BLOB.data));
  const html = new TextDecoder().decode(plain);
  try { sessionStorage.setItem("nvd-pass", pass); } catch (e) {}
  document.open(); document.write(html); document.close();
}
const msg = document.getElementById("msg");
document.getElementById("gate").addEventListener("submit", async e => {
  e.preventDefault();
  msg.className = ""; msg.textContent = "Opening…";
  try { await open(document.getElementById("pw").value); }
  catch (err) { msg.className = "err"; msg.textContent = "That password didn't work. Check with the team and try again."; }
});
let saved = null;
try { saved = sessionStorage.getItem("nvd-pass"); } catch (e) {}
if (saved) open(saved).catch(() => {});

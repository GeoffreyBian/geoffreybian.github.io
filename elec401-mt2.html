  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(BLOB.iv) }, key, bytes(BLOB.data));
  const html = new TextDecoder().decode(plain);
  try { sessionStorage.setItem("elec401-pass", pass); } catch (e) {}
  document.open(); document.write(html); document.close();
}
const msg = document.getElementById("msg");
document.getElementById("gate").addEventListener("submit", async e => {
  e.preventDefault();
  msg.className = ""; msg.textContent = "Opening…";
  try { await open(document.getElementById("pw").value); }
  catch (err) { msg.className = "err"; msg.textContent = "That password didn't work. Try again."; }
});
let saved = null;
try { saved = sessionStorage.getItem("elec401-pass"); } catch (e) {}
if (saved) open(saved).catch(() => {});
</script>
